# ClusterSecretStore — 1Password
#
# Provider-specifico: è l'UNICO file da cambiare per passare a un altro vault manager.
# Non contiene valori: referenzia il token del Service Account 1P (creato da OpenTofu,
# vedi tofu/), che vive in un Secret k8s nel namespace external-secrets.
#
# TODO(confirm): modalità provider ESO 1Password (Service Account vs Connect).
#   - Service Account (consigliato): auth.secretRef.tokenRef → key con il token SA.
#   - Connect: richiede un 1Password Connect server self-hosted.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      # vaults: mappa nome-vault → priorità
      vaults:
        Homelab: 1
      auth:
        secretRef:
          tokenRef:
            name: op-service-account
            namespace: external-secrets
            key: token
