---
apiVersion: apps/v1
kind: Deployment
metadata: {name: homepage, namespace: infra}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: homepage}}
  template:
    metadata: {labels: {app: homepage}}
    spec:
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          ports: [{containerPort: 3000}]
          env:
            - {name: TZ, value: Europe/Rome}
            - {name: HOMEPAGE_ALLOWED_HOSTS, value: "homepage.osharko.lan,192.168.188.200:3000,10.10.0.200:3000,*"}
          volumeMounts:
            - {name: config, mountPath: /app/config, subPath: config}
            - {name: icons, mountPath: /app/public/icons, subPath: icons}
      volumes:
        - {name: config, hostPath: {path: /mnt/tank/containers/homepage, type: Directory}}
        - {name: icons, hostPath: {path: /mnt/tank/containers/homepage, type: Directory}}
---
apiVersion: v1
kind: Service
metadata: {name: homepage, namespace: infra}
spec:
  type: NodePort
  selector: {app: homepage}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: homepage, namespace: infra}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`homepage.osharko.lan`) || Host(`osharko.lan`)
      kind: Rule
      services: [{name: homepage, port: 3000}]
