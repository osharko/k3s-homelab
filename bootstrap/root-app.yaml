# Root application (app-of-apps)
# Punto d'ingresso GitOps: ArgoCD punta a clusters/homelab, che contiene l'ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/osharko/k3s-homelab.git
    targetRevision: HEAD
    path: clusters/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
