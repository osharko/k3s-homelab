apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints: [web]
  routes:
    - match: Host(`argocd.osharko.lan`)
      kind: Rule
      services:
        # install.yaml (non Helm): il Service è "argocd-server".
        # Server patchato con --insecure → serve HTTP su :8080 dietro Traefik.
        - name: argocd-server
          port: 80
